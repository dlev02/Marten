# Netlify configuration for the Marten site.
#
# Production builds run scripts/netlify-build.sh. With a production
# CONVEX_DEPLOY_KEY it deploys the Convex backend first and builds the frontend
# against it, so a push to main ships both together; a failed backend deploy
# fails the build and leaves the live site on the previous version. With a
# missing or non-production key it builds only the frontend, against the
# VITE_CONVEX_URL set in Netlify, so the public site never points at a
# development backend.
#
# Deploy previews and branch builds only build the frontend; they never deploy
# the production backend.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production]
  command = "bash scripts/netlify-build.sh"

# Single-page app: every route is served by index.html and resolved in React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.plaid.com 'sha256-cd+HpnSsLaEz1lKWBNn+k+xOe1m2p5ZgfjoyNvHy9eU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://*.convex.site https://production.plaid.com https://sandbox.plaid.com; frame-src https://cdn.plaid.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
