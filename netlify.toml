# Netlify configuration for the Marten site.
#
# Production builds deploy the Convex backend first, then build the frontend
# against it, so a push to main ships both together. `convex deploy` reads the
# production-scoped CONVEX_DEPLOY_KEY from Netlify and passes the deployment
# URL to the build as VITE_CONVEX_URL. A failed backend deploy fails the build,
# leaving the live site on the previous version.
#
# Deploy previews and branch builds only build the frontend; they never deploy
# the production backend.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.production]
  command = "npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name VITE_CONVEX_URL"

# Single-page app: every route is served by index.html and resolved in React.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
